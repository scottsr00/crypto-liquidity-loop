[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-liquidity-loop"
version = "0.1.0"
description = "BTC breakout research, paper trading, and owner dashboard"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "websockets>=15,<17", "certifi>=2025,<2028"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
liquidity-loop = "crypto_liquidity_loop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_liquidity_loop"]
